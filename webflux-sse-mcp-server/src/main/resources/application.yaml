server:
  port: 17080

spring:
  application:
    name: webflux-sse-mcp-server
  main:
    banner-mode: off
  ai:
    mcp:
      server:
        name: webflux-sse-mcp-server
        version: 1.0.0
        type: ASYNC #异步
        instructions: "This reactive server provides weather information tools and resources"
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: true
        # sse properties
        sse-message-endpoint: /mcp/messages
        keep-alive-interval: 30s
        protocol: sse #协议

    alibaba:
      mcp:
        nacos:
          server-addr: localhost:8848
          username: nacos
          password: nacos
          register:
            enabled: true
            service-group: mcp-server


# 调试日志
logging:
  level:
    io:
      modelcontextprotocol:
        client: DEBUG
        spec: DEBUG
        server: DEBUG