server:
  port: 17090

spring:
  application:
    name: webflux-streamable-mcp-server
  main:
    banner-mode: off
  ai:
    mcp:
      server:
        name: webflux-streamable-mcp-server
        version: 1.0.0
        type: ASYNC
        instructions: "streamable This reactive server provides weather information tools and resources"
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: true
        protocol: streamable
        streamable-http:
          keep-alive-interval: 20s
          disallow-delete: false
          mcp-endpoint: /mcp

    alibaba:
      mcp:
        nacos:
          server-addr: localhost:8848
          username: nacos
          password: nacos
          register:
            enabled: true
            service-group: mcp-server


# 调试日志
logging:
  level:
    io:
      modelcontextprotocol:
        client: DEBUG
        spec: DEBUG
        server: DEBUG