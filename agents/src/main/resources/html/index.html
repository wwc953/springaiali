<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE 流式解析器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-bar input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
            min-width: 200px;
        }

        .control-bar input[type="text"]:focus {
            border-color: #3498db;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-size: 14px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #555;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #bdc3c7;
            display: inline-block;
            transition: background 0.3s;
        }

        .status-indicator.connected {
            background: #2ecc71;
        }

        .status-indicator.error {
            background: #e74c3c;
        }

        .output-area {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #e9ecef;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 15px;
            position: relative;
        }

        .output-area .placeholder {
            color: #adb5bd;
            font-style: italic;
        }

        .output-area .streaming-text {
            color: #2c3e50;
        }

        .output-area .finished-marker {
            display: inline-block;
            margin-left: 8px;
            color: #2ecc71;
            font-weight: bold;
        }

        .raw-log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .raw-log .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #333;
        }

        .raw-log .log-entry .timestamp {
            color: #6c8c9c;
            margin-right: 10px;
        }

        .raw-log .log-entry .data-preview {
            color: #ce9178;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .clear-btn {
            background: #ecf0f1;
            color: #2c3e50;
        }

        .clear-btn:hover {
            background: #d5dbdb;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #95a5a6;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📡 SSE 流式解析器</h1>

    <div class="control-bar">
        <input type="text" id="sseUrl" placeholder="请输入 SSE 端点 URL，例如 /api/chat/stream" value="http://localhost:8080/agents/chat?umsg=请介绍一下Spring AI Alibaba">
        <button class="btn btn-success" id="connectBtn">连接</button>
        <button class="btn btn-danger" id="disconnectBtn" disabled>断开</button>
    </div>

    <div class="status">
        <span class="status-indicator" id="statusIndicator"></span>
        <span id="statusText">未连接</span>
    </div>

    <div class="output-area" id="outputArea">
        <span class="placeholder">等待接收流式内容…</span>
    </div>

    <div class="actions">
        <button class="btn clear-btn" id="clearBtn">清空显示</button>
        <button class="btn clear-btn" id="clearLogBtn">清空日志</button>
    </div>

    <div class="raw-log" id="rawLog">
        <div class="log-entry"><span class="timestamp">[系统]</span> 日志将显示接收到的原始 SSE 数据。</div>
    </div>

    <div class="footer">
        提示：该页面通过 EventSource 接收 SSE 流，自动解析 JSON 并提取 <code>message.text</code> 或 <code>text</code>
        字段内容。
    </div>
</div>

<script>
    (function () {
        // DOM 元素
        const sseUrlInput = document.getElementById('sseUrl');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const outputArea = document.getElementById('outputArea');
        const rawLog = document.getElementById('rawLog');
        const clearBtn = document.getElementById('clearBtn');
        const clearLogBtn = document.getElementById('clearLogBtn');

        let eventSource = null;
        let isConnected = false;
        let fullText = ''; // 累积当前回复的完整文本
        let currentMessageId = null; // 用于标识不同的回复轮次（可选）

        // ---------- 辅助函数 ----------
        function setStatus(state, message) {
            statusIndicator.className = 'status-indicator';
            // if (state === 'connected') {
            //     statusIndicator.classList.add('connected');
            // } else if (state === 'error') {
            //     statusIndicator.classList.add('error');
            // }
            statusText.textContent = message;
        }

        function addLog(message, isSystem = true) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const timestamp = new Date().toLocaleTimeString();
            const prefix = isSystem ? '[系统]' : '[数据]';
            entry.innerHTML = `<span class="timestamp">${timestamp}</span> ${prefix} ${message}`;
            rawLog.appendChild(entry);
            rawLog.scrollTop = rawLog.scrollHeight;
        }

        function updateOutput(text, append = true) {
            // 移除占位符（如果存在）
            const placeholder = outputArea.querySelector('.placeholder');
            if (placeholder) placeholder.remove();

            if (append) {
                // 流式追加
                outputArea.innerHTML += text;
            } else {
                // 设置完整文本（例如结束时）
                outputArea.innerHTML = text;
            }
            outputArea.scrollTop = outputArea.scrollHeight;
        }

        function resetUI() {
            fullText = '';
            outputArea.innerHTML = '<span class="placeholder">等待接收流式内容…</span>';
        }

        // ---------- 核心解析函数 ----------
        function processSSEData(dataStr) {
            // 尝试解析 JSON
            let json;
            try {
                json = JSON.parse(dataStr);
            } catch (e) {
                addLog(`无效 JSON: ${dataStr}`, false);
                return;
            }

            // 打印原始 JSON 到日志
            addLog(`收到数据: ${JSON.stringify(json)}`, false);
            if (json) {
                 if (json.message.metadata.finishReason === 'STOP') {
                    console.log('流式输出完成');
                    // 可在此处关闭连接
                    eventSource.close();
                } else {
                     updateOutput(json.chunk  );
                 }
            }
            // 1. 根据 outputType 处理
            // const outputType = json.outputType || json.type; // 兼容不同字段名
            // console.log("outputType---", outputType)
            //
            //  // 提取文本内容：优先取 message.text，其次 text，再其次 content
            // let deltaText = "";

            // 如果是流式输出（AGENT_MODEL_STREAMING 或类似的 STREAMING），追加文本
            // if (outputType === 'AGENT_MODEL_STREAMING' || outputType === 'STREAMING' || outputType === 'streaming') {
            //     if (json.messageType === "assistant") {
            //         if (json.message.metadata.reasoningContent) {
            //             deltaTet = json.message.metadata.reasoningContent;
            //         } else {
            //             deltaTet = json.message.textContent;
            //         }
            //     }
            //     if (deltaText) {
            //         fullText += deltaText;
            //         // 显示累积文本
            //         updateOutput(fullText, true);
            //     } else {
            //         // 可能没有文本，但有其他控制信息，忽略
            //         addLog(`流式数据无文本内容，outputType=${outputType}`, false);
            //     }
            // }
            // // 如果是完成事件（AGENT_MODEL_FINISHED 等），可以标记结束
            // else if (outputType === 'AGENT_MODEL_FINISHED' || outputType === 'FINISHED' || outputType === 'finished') {
            //     // 可能包含最终完整文本，如果有则替换
            //     if (deltaText) {
            //         fullText = deltaText; // 或 fullText = deltaText 覆盖
            //         updateOutput(fullText, false);
            //         // 添加完成标记（可选）
            //         outputArea.innerHTML += ' <span class="finished-marker">✅</span>';
            //     } else {
            //         // 没有文本，仅标记完成
            //         addLog(`流结束（无最终文本）`, false);
            //     }
            //     // 可以在这里自动断开连接（如果需要）
            //     // 但为了演示，让用户手动断开
            // }
            // // 其他类型：工具调用、hook 等，可以选择显示或忽略
            // else {
            //     // 如果有文本，可以展示
            //     if (deltaText) {
            //         // 可能不属于流式文本，但可以追加显示
            //         fullText += deltaText;
            //         updateOutput(fullText, true);
            //     } else {
            //         addLog(`忽略类型: ${outputType}`, false);
            //     }
            // }
        }

        // ---------- EventSource 连接 ----------
        function connect() {
            if (eventSource) {
                disconnect();
            }

            const url = sseUrlInput.value.trim();
            if (!url) {
                alert('请输入有效的 SSE URL');
                return;
            }

            try {
                eventSource = new EventSource(url);
                isConnected = true;
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                setStatus('connected', '已连接');
                addLog(`正在连接: ${url}`);

                // 重置显示
                resetUI();
                fullText = '';

                // 监听消息
                eventSource.onmessage = function (event) {
                    if (event.data) {
                        processSSEData(event.data);
                    }
                };

                // 监听打开
                eventSource.onopen = function () {
                    addLog('连接已建立');
                    setStatus('connected', '已连接');
                };

                // 监听错误
                eventSource.onerror = function (error) {
                    // EventSource 在连接断开时会触发 error，如果 readyState === CLOSED 表示正常关闭
                    if (eventSource.readyState === EventSource.CLOSED) {
                        addLog('连接已关闭');
                        setStatus('error', '已断开');
                        disconnect(); // 清理
                    } else {
                        addLog('连接错误，尝试重连...');
                        setStatus('error', '连接错误，重连中...');
                    }
                };

            } catch (err) {
                addLog(`连接失败: ${err.message}`);
                setStatus('error', '连接失败');
                disconnect();
            }
        }

        function disconnect() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            isConnected = false;
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            setStatus('error', '已断开');
            addLog('手动断开连接');
        }

        // ---------- 事件绑定 ----------
        connectBtn.addEventListener('click', connect);

        disconnectBtn.addEventListener('click', function () {
            disconnect();
        });

        clearBtn.addEventListener('click', function () {
            resetUI();
            fullText = '';
            addLog('显示区域已清空');
        });

        clearLogBtn.addEventListener('click', function () {
            rawLog.innerHTML = '';
            addLog('日志已清空');
        });

        // 初始状态
        disconnectBtn.disabled = true;
        setStatus('', '未连接');

        // 窗口关闭时断开连接
        window.addEventListener('beforeunload', function () {
            if (eventSource) {
                eventSource.close();
            }
        });

        // 可选：支持回车键连接
        sseUrlInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                connect();
            }
        });

        // 暴露一些函数到控制台便于调试
        window.__sseDebug = {
            connect,
            disconnect,
            resetUI,
            fullText: () => fullText,
        };
    })();
</script>
</body>
</html>
