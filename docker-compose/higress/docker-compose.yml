version: '3.8'

services:

  # Higress AI Cache Use
  redis:
    #    image: redis
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/redis-stack-server:7.4.0-v3
    ports:
      - "6379:6379"
    environment:
      - TZ=Asia/Shanghai
    container_name: higress-redis
    volumes:
      #      - /d/docker-data/redis/data:/data
      - ~/docker-data/redis/data:/data
    #      - ./conf/redis.conf:/etc/redis/redis-stand.conf
    #    command: redis-server /etc/redis/redis-stand.conf
    networks:
      - spring-ai-alibaba-higress

  higress:
    container_name: spring-ai-alibaba-higress
    pull_policy: always
    tty: true
    restart: unless-stopped
    volumes:
      #      - /d/docker-data/higress/data:/data #win
      - ~/docker-data/higress/data:/data #mac
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:latest
    ports:
      - "18001:8001"
      - "18443:8443"
      - "18080:8080"
    networks:
      - spring-ai-alibaba-higress

  nacos:
    image: nacos/nacos-server:v3.1.1
    #    image: nacos-registry.cn-hangzhou.cr.aliyuncs.com/nacos/nacos-server:v3.0.1
    container_name: nacos-standalone-3.1.1
    environment:
      - PREFER_HOST_MODE=hostname #获取服务实例的地址优先使用主机名
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - NACOS_AUTH_TOKEN=VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=
    volumes:
      #      - /d/docker-data/nacos3.1.1/standalone-logs/:/home/nacos/logs
      - ~/docker-data/nacos3.1.1/standalone-logs/:/home/nacos/logs
    ports:
      - "8080:8080"
      - "8848:8848"
      - "9848:9848"
    networks:
      - spring-ai-alibaba-higress

  #  prometheus:
  #    container_name: prometheus
  #    image: prom/prometheus:latest
  #    ports:
  #      - "9090:9090"
  ##    depends_on:
  ##      - higress
  #    networks:
  #      - spring-ai-alibaba-higress
  #  grafana:
  #    container_name: grafana
  #    image: grafana/grafana
  #    ports:
  #      - 3000:3000
  #    environment:
  #      - GF_SECURITY_COOKIE_SECURE=true
  #      - GF_SECURITY_COOKIE_SAMESITE=none
  #      - GF_SECURITY_ALLOW_EMBEDDING=true
  #    networks:
  #      - spring-ai-alibaba-higress

  app:
    build:
      context: ./../../mcp-server
      dockerfile: Dockerfile
    image: mcp-server-image:v1.0  # 指定镜像名称
    container_name: mcp-server-docker  # 指定容器名称
    ports:
      - "17070:17070"
#    volumes:
#      - ./my-docker-app/logs:/logs
    environment:
      - JAVA_OPTS=-Xmx512m
    networks:
      - spring-ai-alibaba-higress


networks:
  spring-ai-alibaba-higress:
    driver: bridge
